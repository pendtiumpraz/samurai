<title>Scrolling Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ─── Scroll Container ─── */
  .scroll-container {
    position: relative;
    width: 100%;
  }

  /* ─── Sticky Frame Viewer ─── */
  .frame-viewer {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #0a0a0f;
  }

  .frame-viewer img {
    max-width: 100%;
    max-height: 100vh;
    object-fit: contain;
    display: block;
    image-rendering: auto;
    transition: opacity 0.1s ease;
  }

  /* ─── Frame Trigger Sections ─── */
  .frame-section {
    height: 100vh;
    width: 100%;
    pointer-events: none;
  }

  /* ─── Info Bar ─── */
  .info-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 100;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .info-bar .frame-count { color: #8b5cf6; font-weight: 600; }
  .progress-bar {
    width: 100px;
    height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b5cf6, #3b82f6);
    transition: width 0.1s;
  }

  /* ─── Mobile ─── */
  @media (max-width: 768px) {
    .info-bar { font-size: 11px; padding: 6px 14px; gap: 8px; }
    .progress-bar { width: 60px; }
  }
</style>

  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>

<script>
(function() {
  const frameImg = document.getElementById('scrollFrame');
  const frameDisplay = document.getElementById('frameDisplay');
  const progressFill = document.getElementById('progressFill');
  const sections = document.querySelectorAll('.frame-section');
  const total = sections.length;
  const viewer = document.querySelector('.frame-viewer');

  // Preload images
  const images = [];
  for (let i = 1; i <= total; i++) {
    const img = new Image();
    const padded = String(i).padStart(4, '0');
    img.src = 'frames_20260628-223012/' + padded + '.jpg';
    images.push(img);
  }

  // Current visible frame
  let currentFrame = 1;

  function updateFrame() {
    const scrollY = window.scrollY;
    const viewH = window.innerHeight;
    const docH = document.documentElement.scrollHeight;

    // Calculate visible section based on scroll
    let frameIdx = 1;
    for (let i = 0; i < sections.length; i++) {
      const rect = sections[i].getBoundingClientRect();
      // When top of section is near viewport center-ish:
      // Using 0.85 threshold: trigger when top < 85% of viewport height
      if (rect.top < viewH * 0.85) {
        frameIdx = i + 1;
      } else {
        break;
      }
    }

    // Clamp
    if (frameIdx < 1) frameIdx = 1;
    if (frameIdx > total) frameIdx = total;

    if (frameIdx !== currentFrame) {
      currentFrame = frameIdx;
      const padded = String(frameIdx).padStart(4, '0');
      const src = 'frames_20260628-223012/' + padded + '.jpg';

      // Pre-fetch next/prev
      const next = Math.min(frameIdx + 1, total);
      const prev = Math.max(frameIdx - 1, 1);
      if (next !== frameIdx) {
        const nImg = new Image();
        nImg.src = 'frames_20260628-223012/' + String(next).padStart(4, '0') + '.jpg';
      }
      if (prev !== frameIdx) {
        const pImg = new Image();
        pImg.src = 'frames_20260628-223012/' + String(prev).padStart(4, '0') + '.jpg';
      }

      frameImg.src = src;
      frameDisplay.textContent = frameIdx;
    }

    // Progress
    const pct = Math.min((scrollY / (docH - viewH)) * 100, 100);
    progressFill.style.width = pct + '%';
  }

  // Throttled scroll handler
  let ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        updateFrame();
        ticking = false;
      });
      ticking = true;
    }
  });

  // Initial update
  window.addEventListener('load', updateFrame);
  window.addEventListener('resize', updateFrame);
  setTimeout(updateFrame, 100);
})();
</script>
